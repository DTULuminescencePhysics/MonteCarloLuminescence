defaults: 
  - _self_
  - physics: phys_harris_lab_TL_geological_50ka
  - mc: monte_carlo_geological_50ka
  - temp: temp_TL_geological_50ka
  - override hydra/job_logging: custom
  - override hydra/hydra_logging: disabled

setup:
  physics_name: geological_50ka
  project: "${mc.name}_${mc.exp_typ}_${setup.physics_name}"
  seed: 2026

hydra:
  run:
    dir: "run/${setup.project}_${now:%Y%m%d-%H%M%S}"
  sweep: 
    dir: "run/${setup.project}_${now:%Y%m%d-%H%M%S}"
    subdir: "trial_${hydra.job.num}" 
  output_subdir: ".config"
  job:
    chdir : true 