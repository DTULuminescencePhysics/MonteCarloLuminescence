defaults:
- user_config: exp1 copy
- _self_
- override hydra/job_logging: custom
- override hydra/hydra_logging: disabled
hydra:
  run:
    dir: run/${user_config.setup.project}_${now:%Y%m%d-%H%M%S}
  sweep:
    dir: run/${user_config.setup.project}_${now:%Y%m%d-%H%M%S}
    subdir: trial_${hydra.job.num}
  output_subdir: .config
  job:
    chdir: true
