# Example LM-OSL (linearly-modulated optically stimulated luminescence) config.
# Intensity ramps I(t) = I0 + I_rate*t, so the optical up-rate sigma*I(t) grows
# with time. Recombination proceeds through localized (tunnelling) channel, which
# is active at room temperature (the CB channel is frozen at 30 C, see
# docs/analysis/CB_in_OSL.txt).
#
# Run with a constant low temperature, e.g.:
#   python main.py physics=phys_example_OSL_LM temp=temp_constant_T temp.T0=30 temp.duration=1000

# Crystal geometry / lattice
uc_h      : 1.e-10
uc_w      : 1.e-10
uc_l      : 1.e-10
dimension : 7.5e-9
rho       : 5.22e25
rho_h     : null    # Hole/recombination-centre density (m^-3); null -> equals rho
urho      : null

# Trap energy levels
E_loc       : 0.8
E_cb        : 1.4
E_loc_sigma : 0.
E_cb_sigma  : 0.

# Filling process (dosing) -- start pre-filled, no dosing during read-out
enable_fill       : False
D0                : 400.
D_dot             : 0
Dd_unit           : s
combine_when_fill : False
recom_pre_fill    : 0
fill_mode         : uniform # uniform | spatial
mu_fill           : null    # null -> use mu (CB delocalization range)
recom_new_pair    : False   # True -> the e-h pair born in one event may recombine

# Localized transitions (off for this LM-OSL test)
enable_tunneling : False
b                : 1.e12
alpha_GS         : 9e12
alpha_ES         : 1.e9
R_tun            : 0.0
VRH              : False

# Delocalized transitions: recombination via the conduction band.
# The ES->CB rate F2*s*exp(-(E_cb-E_loc)/kT) scales smoothly with the excited
# occupation F2, so it tracks the linearly-ramped optical pumping.
enable_cb : True
s         : 1.e10
mu        : 3e-9              # CB mobility range -> recombination reach
R_CB      : 0.0              # recombine on CB entry (no CB retrapping)

# Simulation mode / optical stimulation (OSL)
mode      : OSL
sigma     : 1.0e-26           # optical cross section (m^2)
stim_kind : lm                # linearly-modulated intensity
I0        : 0.                # start with zero intensity
I_rate    : 1.0e33            # photons m^-2 s^-2; sigma*I_rate*t reaches ~s by end

# Misc
retrap_mask_factor : 0.8
lm_resolution      : 1000      # LM-OSL time-step subdivisions of the run
phys_type : null
