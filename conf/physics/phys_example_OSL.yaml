# Crystal geometry / lattice
uc_h      : 1.e-10  # Unit cell height (m)
uc_w      : 1.e-10  # Unit cell width  (m)
uc_l      : 1.e-10  # Unit cell length (m)
dimension : 7.5e-9  # Approximate test-crystal dimension; null = default 7.5 nm
rho       : 5.22e25
rho_h     : null    # Hole/recombination-centre density (m^-3); null -> equals rho
urho      : null

# Trap energy levels
E_loc       : 1.2
E_cb        : 2.0
E_loc_sigma : 0.    # std dev of Gaussian for E_loc (eV); 0 = fixed
E_cb_sigma  : 0.    # std dev of Gaussian for E_cb  (eV); 0 = fixed

# Filling process (dosing) -- start from a pre-filled state, no dosing during read-out
enable_fill       : False
D0                : 400.
D_dot             : 0       # Radiation per time unit
Dd_unit           : s       # s : Gy/s; ka : Gy/ka, etc.
combine_when_fill : False
recom_pre_fill    : 0       # P(recombine) / P(fill vacancy)
fill_mode         : uniform # uniform | spatial
mu_fill           : null    # null -> use mu (CB delocalization range)
recom_new_pair    : False   # True -> the e-h pair born in one event may recombine

# Localized transitions
enable_tunneling : False
b                : 1.e12
alpha_GS         : 9e12
alpha_ES         : 9e9
R_tun            : 1.0      # Retrapping ratio for tunnelling
VRH              : False    # False (default): original tunnelling rate; True: Miller-Abrahams VRH

# Delocalized transitions
enable_cb : True
s         : 1.e12
mu        : 1e-9
R_CB      : 0.0             # Retrapping ratio for CB transitions

# Simulation mode / optical stimulation (OSL)
mode      : OSL            # TL | OSL
stim_kind : lm             # cw (constant I) | lm (linear I(t) = I0 + I_rate*t)

# IR channel: GS -> ES (localized excited state)
sigma_IR  : 1.0e-19        # IR peak/amplitude cross section sigma0 (m^2) = 1e-22 cm^2
I0_IR     : 0              # IR CW intensity (photons m^-2 s^-1)
I_rate_IR : 1e28            # IR LM ramp rate (photons m^-2 s^-3);

# Blue/UV channel: GS -> CB and ES -> CB (direct optical excitation to the band).
# Requires enable_cb=True. Leave null/0 to disable (pure IR).
sigma_blue  : null         # blue/UV peak/amplitude cross section sigma0 (m^2); null -> blue light off
I0_blue     : 0            # blue CW intensity / LM offset (photons m^-2 s^-1)
I_rate_blue : 0            # blue LM ramp rate (photons m^-2 s^-3); used when stim_kind=lm

# Wavelength-dependent photoionisation cross-section sigma(E, T) per channel.

xsec_model_IR : const      # const | lucovsky | grimmeiss
lambda_IR     : 855        # IR stimulation wavelength (nm); ~1.45 eV
E0_IR         : 1.45       # IR optical threshold / trap depth (eV)
m_eff_IR      : 0.79       # effective electron mass m*/m_c (feldspar; grimmeiss only)

xsec_model_blue : const    # const | lucovsky | grimmeiss
lambda_blue     : 470      # blue/UV stimulation wavelength (nm); ~2.64 eV
E0_blue         : 1.45     # blue/UV optical threshold (eV)
m_eff_blue      : 0.79     # effective electron mass m*/m_c (feldspar; grimmeiss only)

# Baril & Huntley (2003) IR intra-centre GS->ES resonance, used when
E1_IR       : 1.44         # principal resonance centre (eV);
sigma_g1_IR : 0.136        # principal Gaussian std dev (eV)
gamma_l1_IR : 0.010        # principal Lorentzian HWHM (eV)
A1_IR       : 1.0          # principal relative amplitude
E2_IR       : 1.57         # secondary Gaussian centre (eV);
sigma_g2_IR : 0.21         # secondary Gaussian std dev (eV)
A2_IR       : 0.333        # secondary relative amplitude
E3_IR       : null         # optional third Gaussian centre (eV);
sigma_g3_IR : 0.0          # third Gaussian std dev (eV)
A3_IR       : 0.0          # third relative amplitude

# Misc
retrap_mask_factor : 0.8   # Factor to constraint retrapping in adjescent pairs
phys_type : null
