method: RJMCMC
iters: 1000
T_Target: 30.0
T0_lo: 120.0
T0_hi: 140.0
T_tolerance: 1.0
monotonic: free
min_internal: 0
max_internal: 20
rjmcmc:
  logLikeSigma: 0.01
  parameters:
    p_birth: 0.2
    p_death: 0.2
    p_move_time: 0.2
    p_move_temp: 0.2
    p_move_endpoints: 0.2
    sigma_birth: 20.0
    sigma_t_birth: 15.0
    sigma_temp: 20.0
    sigma_time_frac: 15.0
    sigma_endpoints: 5.0
  burn_in:
    burn: true
    max_steps: 20000
    window: 100
    patience_windows: 2
    adjustment_factor: 0.05
    eta_sigma: 2.0
    eta_prob: 0.08
    move_bounds:
    - 0.03
    - 0.26
    overall_check: false
    individual_check: true
    overall_accept_target: null
    birth_accept_target:
    - 0.001
    - 0.05
    death_accept_target:
    - 0.001
    - 0.05
    move_time_accept_target:
    - 0.2
    - 0.4
    move_temp_accept_target:
    - 0.2
    - 0.4
    move_endpoints_accept_target:
    - 0.2
    - 0.4
    sigma_birth_bounds:
    - 1.0
    - 100.0
    sigma_birth_t_bounds:
    - 1.0
    - 100.0
    sigma_time_bounds:
    - 1.0
    - 100.0
    sigma_temp_bounds:
    - 1.0
    - 100.0
    sigma_endpoints_bounds:
    - 1.0
    - 100.0
    verbose: true
