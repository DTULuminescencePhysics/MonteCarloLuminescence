method: RJMCMC  # Either RJMCMC or IVMC
iters: 10 #Number of iteration steps
T_Target: 0.0 # Target final temperature
T0_lo: 80.0 # Minimum T0 value
T0_hi: 120.0 # Maximum T0 value 
T_tolerance: 5.0 # Allow ± T_tolerance to minimum and maximum temperatures
monotonic: free #free, increasing or decreasing
min_internal: 0 # minimum number of time temperature nodes
max_internal: 10 # maximum number of time temperature nodes

rjmcmc:
    log_likelihood:
        mode: "Gaussian" # "Gaussian", "FullGaussian", "student-t", "L1", "L1L2Hybrid", "Bernoulli"
        sigma: 0.1 
        cov: null 
        nud: null 
    log_prior_prob:
        lam_k: 5.0 
        sigma_curv: 25.0          
        nu_curv: 20.0
        dt_min: 1e-9
        p_creep: 0.05        
        sigma_creep: 2.0      
        nu_step: 3.0          
        sigma_step: 10.0    
        dT_min_change: 5.0  
        hard_reject_short_dt: False
        gap_barrier_alpha: 1e-2   
        gap_barrier_power: 2.0
        eps: 1e-12 
    parameters:
        p_birth: 0.20 
        p_death:  0.20
        p_move_time: 0.25 
        p_move_temp: 0.25 
        p_move_endpoints: 0.10
        sigma_birth: 1.0 
        sigma_temp: 0.5
        sigma_time_frac: 0.15
        sigma_endpoints: 0.5
    burn_in:
        burn: False
        max_steps: 1000  
        window: 100
        overall_accept_target: [0.2,0.4]
        per_move_accept_target: null # Optional[Mapping[str, Tuple[float, float]]] 
        birth_death_min: 0.2 # Optional[float]
        min_move_prob: 0.03
        max_adjust_factor: 2.0
        target_k_internal: null # null or float
        k_window: 500
        patience_windows:  2
        verbose: True

