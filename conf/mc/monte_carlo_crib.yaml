name     : mc # Name of the experiment
exp_typ  : TL      # Type of experiment
duration : 160    # Simulation time in specified units
max_dt   : 0.5       # Maximum time step in specified time units 
t_pcnt    : 0       # Ratio of filled electrons traps
h_pcnt    : 0     # Ratio of recombination holes that are unfilled
reps     : 30      # Number of Monte Carlo simulations to repeat
l        : null    # Length of test crystal
w        : null    # Width of test crystal
h        : null    # Height of test crystal

 
Temperature:
  unit: s # unit of time s -- sections, y -- years, Ma -- mega-annum i.e. 1000000 years
  celsius: true # true if temperatures are given in celsius else false for kelvin 
  kind: constant # constant; linear; step; steps; lineardrops; linearsteps; exponetial
  T0: 100 # Initial temperature, always required in celsius
  times: [0.1] # times steps occur
  dT_step: [20] # size(s) of step(s) down either
  dT: [5] # linear rate of change(s). If using linearsteps one more gradient than number of steps must be given
  T_inf: 0 # Minimum temperature if using exponential cooling
  k: 10 # Exponential factor in T(t) = T_inf + (T0 - T_inf) * exp(-k t)
  # T_end: 800 # Final temperature, if required in celsius 
  # No_steps: 1 # Number of temperature step events